# 把 main 分支（含 tag）镜像到 Gitee，保持两边一致。
#
# 用之前只需要做一次：
#   1. 在 Gitee 建好同名仓库（空仓库，不要初始化 README）
#   2. Gitee → 设置 → 私人令牌：新建一个令牌，勾上 projects 权限，复制出来
#   3. 本仓库 → Settings → Secrets and variables → Actions → New repository secret
#      名字填 GITEE_TOKEN，值粘贴令牌
# 没配 GITEE_TOKEN 时工作流会直接跳过，不会报红。
name: Mirror to Gitee

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to Gitee
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_USER: mylizhixiang
          GITEE_REPO: autoswipe-helper
        run: |
          if [ -z "$GITEE_TOKEN" ]; then
            echo "未配置 GITEE_TOKEN，跳过镜像"
            exit 0
          fi
          git fetch --tags --force
          git push --force --tags \
            "https://${GITEE_USER}:${GITEE_TOKEN}@gitee.com/${GITEE_USER}/${GITEE_REPO}.git" \
            "HEAD:refs/heads/main"
