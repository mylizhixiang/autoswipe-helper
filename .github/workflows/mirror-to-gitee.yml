# 把 main 分支（含 tag）镜像到 Gitee，保持两边一致。
#
# 已经配好了：Gitee 仓库 l1107664795/autoswipe-helper，令牌存在本仓库的
# Settings → Secrets and variables → Actions → GITEE_TOKEN 里。
# 换令牌时只改那个 secret 即可；没配 secret 时工作流会直接跳过，不会报红。
name: Mirror to Gitee

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to Gitee
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_USER: l1107664795
          GITEE_REPO: autoswipe-helper
        run: |
          if [ -z "$GITEE_TOKEN" ]; then
            echo "未配置 GITEE_TOKEN，跳过镜像"
            exit 0
          fi
          git fetch --tags --force
          git push --force --tags \
            "https://${GITEE_USER}:${GITEE_TOKEN}@gitee.com/${GITEE_USER}/${GITEE_REPO}.git" \
            "HEAD:refs/heads/main"
