apply plugin: 'com.android.application'

// 正式签名配置：从仓库根目录的 keystore.properties 读取（该文件不进版本库，见 .gitignore）。
// 没有这个文件时 release 包就是未签名的，仍然能 assembleDebug 出 debug 包。
def keystorePropsFile = rootProject.file('keystore.properties')
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}
def hasReleaseKey = keystorePropsFile.exists() && keystoreProps['storeFile'] != null

android {
    namespace 'com.autoswipe.helper'
    compileSdk 33

    defaultConfig {
        applicationId "com.autoswipe.helper"
        minSdk 24
        targetSdk 33
        versionCode 2
        versionName "1.1"
    }

    signingConfigs {
        release {
            if (hasReleaseKey) {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseKey) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        encoding "UTF-8"
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
}
